# HTTP: redirect everything to HTTPS
server {
    listen 80;
    server_name app.tyagi.fun;
    return 301 https://$host$request_uri;
}

# HTTPS: app.tyagi.fun, using YOUR certificates
# Place your certificate files in the certs/ folder next to
# docker-compose.yml, before running docker compose up:
#   certs/fullchain.pem   (your certificate, full chain)
#   certs/privkey.pem     (your private key)
# If your files have different names, either rename them to the
# names above when you copy them, or edit the two ssl_certificate
# lines below to match your filenames.
# Do NOT send the private key in chat, and do NOT commit it to git.
server {
    listen 443 ssl;
    server_name app.tyagi.fun;
    client_max_body_size 10m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
