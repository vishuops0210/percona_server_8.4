---
ansible_user: ubuntu
ansible_become: true
percona_root_password: '{{ vault_percona_root_password }}'
percona_admin_password: '{{ vault_percona_root_password }}'
percona_address: '{{ ansible_host }}'
percona_bind_address: '0.0.0.0'
percona_group_name: c17fdd55-1f5f-4a01-8799-b3e729163ff3
percona_group_seed: db1
percona_group_password: '{{ vault_replication_password }}'
percona_max_connections: 200
percona_databases: 
  - name: testdb
  # - name: testdb2
# Day-2 examples, applied with playbooks/operations/access.yml, no restart.
# Uncomment, fill in, rerun access.yml. Omitting a user does not delete it.
# To remove a user, list it with state: absent. To drop a database, list it
# with state: absent AND set percona_allow_database_drop: true.
# percona_users:
# - name: appuser2
#   password: "{{ vault_appuser2_password }}"
#   priv: "appdb2.*:SELECT,INSERT,UPDATE,DELETE"
# Dynamic config, applied with playbooks/operations/configure.yml, no restart:
# percona_max_connections: 150
# percona_slow_query_time: 2
# percona_binlog_expire_logs_seconds: 604800
# Static config changes restart nodes one at a time. See docs/day-2-configuration.md.
percona_users: []
  # - name: testuser2
  #   password: '{{ vault_testuser2_password }}'
  #   priv: 'testdb2.*:SELECT,INSERT,UPDATE,DELETE'


backup_db_password: '{{ vault_backup_password }}'
backup_schedule_enabled: true
exporter_db_password: '{{ vault_exporter_password }}'
exporter_listen_address: '0.0.0.0'
proxysql_admin_password: '{{ vault_proxysql_admin_password }}'
proxysql_monitor_password: '{{ vault_proxysql_monitor_password }}'
