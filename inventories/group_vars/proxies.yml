---
proxysql_listen_address: '0.0.0.0'
proxysql_users:
- name: appuser
  password: '{{ vault_app_password }}'
  priv: appdb.*:SELECT,INSERT,UPDATE,DELETE
proxysql_query_rules: []
# Enable only after choosing an unused VIP and the correct interface on both proxies.
proxysql_ha_enabled: false
proxysql_ha_interface: ens18
proxysql_ha_vip: 192.0.2.50/24
