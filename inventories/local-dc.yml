---
# Local data centre lab, 2026-11-10. 3 DB nodes + 1 ProxySQL.
# Controller is the laptop; proxy1 is .55. Mapping: db1=.56, db2=.57, db3=.54.
# percona_min_memory_mb is lab-only: VMs are 2 GB, production default is 3584.
all:
  vars:
    percona_min_memory_mb: 1700
    # Lab-only: 256M pool, not the role default 50 percent of RAM (896M here).
    # The 896M pool starved these 2 GB VMs and mysqld on db1 died about once
    # a minute, likely OOM, with no swap at all. 256M is plenty for the lab
    # testdb; production keeps the 50 percent default.
    percona_innodb_buffer_pool_size: 256M
    # Database hosts the backup reads from. The backup runs on the ProxySQL
    # host and discovers the primary from this list, so it survives failover.
    # Plain list on purpose: no Jinja here, so the inventory stays readable
    # and the value is certain before any playbook runs.
    backup_db_hosts:
    - 192.168.8.56
    - 192.168.8.57
    - 192.168.8.54
  children:
    database:
      children:
        gr_members:
          hosts:
            db1:
              ansible_host: 192.168.8.56
              percona_server_id: 101
            db2:
              ansible_host: 192.168.8.57
              percona_server_id: 102
            db3:
              ansible_host: 192.168.8.54
              percona_server_id: 103
    proxies:
      hosts:
        proxy1:
          ansible_host: 192.168.8.55
    backup_sources:
      hosts:
        proxy1: {}
    monitoring_targets:
      hosts:
        db1: {}
        db2: {}
        db3: {}
    restore_targets:
      hosts: {}