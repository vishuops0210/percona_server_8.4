---
# Local data centre lab, 2026-11-10. 3 DB nodes + 1 ProxySQL.
# Controller is the laptop; proxy1 is .55. Mapping: db1=.56, db2=.57, db3=.54.
all:
  children:
    database:
      children:
        gr_members:
          hosts:
            db1:
              ansible_host: 192.168.8.56
              percona_server_id: 101
            db2:
              ansible_host: 192.168.8.57
              percona_server_id: 102
            db3:
              ansible_host: 192.168.8.54
              percona_server_id: 103
    proxies:
      hosts:
        proxy1:
          ansible_host: 192.168.8.55
    backup_sources:
      hosts:
        proxy1: {}
    monitoring_targets:
      hosts:
        db1: {}
        db2: {}
        db3: {}
    restore_targets:
      hosts: {}