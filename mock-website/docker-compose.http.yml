# Plain-HTTP override for local testing without SSL certificates.
# Usage: docker compose -f docker-compose.yml -f docker-compose.http.yml up -d --build
# Then open http://localhost:8080

services:
  web:
    ports:
      - "8080:80"
    volumes:
      # Swap in the HTTP-only Nginx config, and drop the certs mount.
      - ./nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
