# Nginx config for the Verified Restore mock website.
# Serves the React single-page app with a fallback to index.html,
# gzip on, and long cache headers for hashed assets.

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name mock.tyagi.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mock.tyagi.fun;

    # SSL certificates, mounted read-only from ./certs on the host.
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page app fallback: any route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets (index-*.js, index-*.css): cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry page, so deploys show up at once.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
