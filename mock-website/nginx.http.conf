# HTTP-only Nginx config for local testing (no SSL).
# Used by docker-compose.http.yml. Do not use for the public site.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Single-page app fallback: any route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets (index-*.js, index-*.css): cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry page, so deploys show up at once.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
