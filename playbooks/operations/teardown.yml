---
# Teardown the entire Percona MySQL setup (Group Replication + ProxySQL).
# This DELETES ALL DATA. There is no undo.
#
# Run from the repo root, on the branch that built the cluster:
#   ansible-playbook -i inventories/group-one-proxy.yml playbooks/operations/teardown.yml \
#     --extra-vars "teardown_confirm=yes" --ask-vault-pass
#
# The teardown_confirm variable is required. The playbook refuses to run
# without it, so it cannot run by accident.
#
# What it removes:
# - MySQL and ProxySQL services (stopped, disabled, purged).
# - /var/lib/mysql on all DB nodes (all databases, all users, all data).
# - /etc/mysql, /var/log/mysql, /etc/percona-backup on all DB nodes.
# - /etc/proxysql, /var/lib/proxysql on proxy1.
# - /var/backup on all hosts (local agent backups).
# - Percona Server, client and XtraBackup packages on all hosts.
# It does NOT remove:
# - MinIO bucket backups (they are off-box and untouched).
# - The Recevo agent code on proxy1 (/home/vishal/agent).
# - The Ansible files on proxy1 (/home/vishal/ansible).
# - The Ansible roles, playbooks or inventory in this repo.
# After teardown, rebuild with preflight + group-one-proxy.yml and new
# passwords in a fresh vault.yml.
- name: Confirm the teardown is intentional
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse to run without explicit confirmation
      ansible.builtin.assert:
        that:
          - teardown_confirm | default('') == 'yes'
        fail_msg: >
          This playbook deletes all MySQL data. Run it again with
          --extra-vars "teardown_confirm=yes" to confirm.

- name: Teardown the database nodes
  hosts: gr_members
  become: true
  tasks:
    - name: Stop and disable the MySQL service
      ansible.builtin.systemd:
        name: mysql
        state: stopped
        enabled: false
      failed_when: false

    - name: Purge the Percona packages
      ansible.builtin.apt:
        name:
          - percona-server-server
          - percona-server-client
          - percona-xtrabackup-84
        state: absent
        purge: true
        autoremove: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      failed_when: false

    - name: Remove the MySQL datadir and config
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/mysql
        - /etc/mysql
        - /var/log/mysql
        - /etc/percona-backup
        - /var/backup

- name: Teardown the ProxySQL node
  hosts: proxies
  become: true
  tasks:
    - name: Stop and disable the ProxySQL service
      ansible.builtin.systemd:
        name: proxysql
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop and disable the MySQL service on proxy1
      ansible.builtin.systemd:
        name: mysql
        state: stopped
        enabled: false
      failed_when: false

    - name: Purge the ProxySQL and Percona packages
      ansible.builtin.apt:
        name:
          - proxysql
          - percona-server-server
          - percona-server-client
        state: absent
        purge: true
        autoremove: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      failed_when: false

    - name: Remove the ProxySQL and MySQL config and data
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/proxysql
        - /var/lib/proxysql
        - /var/log/proxysql
        - /etc/mysql
        - /var/lib/mysql
        - /var/log/mysql
        - /etc/percona-backup
        - /var/backup
