---
- name: Create private exporter directory
  ansible.builtin.file:
    path: /etc/mysqld_exporter
    state: directory
    owner: mysqld_exporter
    group: mysqld_exporter
    mode: '0700'
- name: Render exporter connection settings
  ansible.builtin.template:
    src: exporter.cnf.j2
    dest: /etc/mysqld_exporter/client.cnf
    owner: mysqld_exporter
    group: mysqld_exporter
    mode: '0600'
  no_log: true
  diff: false
  notify: mysql_exporter_restart
- name: Install exporter service
  ansible.builtin.template:
    src: mysqld_exporter.service.j2
    dest: /etc/systemd/system/mysqld_exporter.service
    mode: '0644'
  notify: mysql_exporter_restart
- name: Apply exporter changes
  ansible.builtin.meta: flush_handlers
- name: Enable exporter
  ansible.builtin.systemd:
    name: mysqld_exporter
    state: started
    enabled: true
    daemon_reload: true
