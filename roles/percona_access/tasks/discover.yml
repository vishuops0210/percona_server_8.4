---
- name: Find the current writable database
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT MEMBER_HOST FROM performance_schema.replication_group_members WHERE MEMBER_ID=@@server_uuid AND MEMBER_STATE='ONLINE' AND MEMBER_ROLE='PRIMARY'
  delegate_to: '{{ item }}'
  loop: "{{ groups['gr_members'] }}"
  register: percona_writer_results
  changed_when: false
  no_log: true
- name: Select writer inventory name
  ansible.builtin.set_fact:
    percona_writers: "{{ percona_writer_results.results | selectattr('query_result.0', 'ne', []) | map(attribute='item') | list }}"
- name: Require one writer for account changes
  ansible.builtin.assert:
    that: percona_writers | length == 1
    fail_msg: No unique writable database found. Start the database/group before configuring accounts.
- name: Use the discovered writer
  ansible.builtin.set_fact:
    percona_account_host: '{{ percona_writers | first }}'
