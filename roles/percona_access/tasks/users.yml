---
- name: Manage explicitly listed application accounts
  community.mysql.mysql_user:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    name: '{{ item.name }}'
    host: '{{ item.host | default(''%'') }}'
    plugin: '{{ (item.plugin | default("caching_sha2_password")) if item.state | default("present") == "present" else omit }}'
    plugin_auth_string: '{{ item.password if item.state | default("present") == "present" else omit }}'
    salt: '{{ ((item.name ~ '':'' ~ (item.host | default(''%''))) | hash(''sha256''))[:20] if item.state | default(''present'') == ''present'' and item.plugin
      | default(''caching_sha2_password'') == ''caching_sha2_password'' else omit }}'
    priv: '{{ item.priv if item.state | default("present") == "present" else omit }}'
    state: '{{ item.state | default(''present'') }}'
  loop: '{{ percona_users }}'
  no_log: true
