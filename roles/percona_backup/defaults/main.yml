---
percona_root_username: root
percona_root_password: ''
percona_socket: /var/run/mysqld/mysqld.sock
percona_port: 3306
backup_db_user: backup
backup_db_password: ''
backup_storage: local
backup_path: /var/backup/mysql
backup_parallel: 2
backup_schedule_enabled: false
backup_incremental_enabled: false
backup_hour: '1'
backup_minute: '0'
backup_retention_days: 7
backup_prune_enabled: true
backup_prune_hour: '2'
backup_prune_minute: '30'
backup_binlog_archive_enabled: true
backup_binlog_path: /var/backup/binlog
backup_minio_endpoint: ''
backup_minio_access_key: ''
backup_minio_secret_key: ''
backup_minio_bucket: percona-backup
backup_mc_url: ''
backup_mc_checksum: ''
backup_restore_id: ''
backup_restore_target: ''
backup_restore_workdir: ''
backup_restore_as_replica: false
