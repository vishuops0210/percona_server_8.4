---
- name: Read local group state
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT MEMBER_STATE FROM performance_schema.replication_group_members WHERE MEMBER_ID=@@server_uuid
  register: gr_local
  until: gr_local.query_result is defined and gr_local.query_result[0] | selectattr('MEMBER_STATE', 'equalto', 'RECOVERING') | list | length == 0
  retries: 60
  delay: 5
  changed_when: false
  no_log: true
- name: Remember which members are online
  ansible.builtin.set_fact:
    gr_online: "{{ gr_local.query_result[0] | selectattr('MEMBER_STATE', 'equalto', 'ONLINE') | list | length > 0 }}"
- name: Inspect previous group bootstrap marker
  ansible.builtin.stat:
    path: /var/lib/mysql/.ansible-gr-created
  register: gr_marker
- name: List online members
  ansible.builtin.set_fact:
    gr_online_hosts: "{{ groups['gr_members'] | map('extract', hostvars) | selectattr('gr_online', 'equalto', true) | map(attribute='inventory_hostname') | list }}"
  run_once: true
- name: Do not bootstrap an established group again
  ansible.builtin.assert:
    that:
    - groups['gr_members'] | difference(ansible_play_hosts_all) | length == 0
    - gr_online_hosts | length > 0 or (groups['gr_members'] | map('extract', hostvars) | map(attribute='gr_marker.stat.exists') | select('equalto', true) | list | length == 0)
    - percona_group_password | length > 0
    fail_msg: Run against all group members. If an established group is fully offline, recover it deliberately; this setup never force-bootstraps it.
  run_once: true
- name: Prepare offline members
  ansible.builtin.include_tasks: member.yml
  when: not gr_online
- name: Bootstrap the first group
  ansible.builtin.include_tasks: bootstrap.yml
  when: gr_online_hosts | length == 0
  run_once: true
- name: Read recovery channel username before joining
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT USER AS CHANNEL_USER FROM performance_schema.replication_connection_configuration WHERE CHANNEL_NAME='group_replication_recovery'
  register: gr_recovery_channel
  changed_when: false
  no_log: true
  when: not gr_online and not (inventory_hostname == percona_group_seed and gr_online_hosts | length == 0)
- name: Fail fast if recovery channel username is empty or wrong
  ansible.builtin.assert:
    that:
    - gr_recovery_channel.query_result[0] | length > 0
    - gr_recovery_channel.query_result[0][0].CHANNEL_USER | default('') | length > 0
    - gr_recovery_channel.query_result[0][0].CHANNEL_USER == percona_group_user
    fail_msg: >-
      Recovery channel group_replication_recovery has an empty or wrong username on this member.
      Do not run START GROUP_REPLICATION yet, it will fail with Invalid (empty) username and leave the group.
      Re-run the offline member preparation step so CHANGE REPLICATION SOURCE TO sets SOURCE_USER to the group recovery user, then verify the channel again.
  when: not gr_online and not (inventory_hostname == percona_group_seed and gr_online_hosts | length == 0)
- name: Join offline members to the group
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: START GROUP_REPLICATION
  when: not gr_online and not (inventory_hostname == percona_group_seed and gr_online_hosts | length == 0)
  # Transient GCS failures on join, seen on db3 in earlier runs, clear in
  # seconds and succeed on rerun. Retry here so one transient failure does
  # not stop the whole deploy. A real failure still fails after 5 attempts.
  register: gr_join
  until: gr_join is succeeded
  retries: 5
  delay: 10
  no_log: true
- name: Wait for this member to become online
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT MEMBER_STATE FROM performance_schema.replication_group_members WHERE MEMBER_ID=@@server_uuid
  register: gr_joined
  until: gr_joined.query_result is defined and gr_joined.query_result[0] | selectattr('MEMBER_STATE', 'equalto', 'ONLINE') | list | length == 1
  retries: 60
  delay: 5
  changed_when: false
  no_log: true

- name: Record group membership
  ansible.builtin.file:
    path: /var/lib/mysql/.ansible-gr-created
    state: touch
    owner: mysql
    group: mysql
    mode: '0600'
    modification_time: preserve
    access_time: preserve
