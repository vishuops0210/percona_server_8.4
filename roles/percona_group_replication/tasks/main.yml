---
- name: Read local group state
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT MEMBER_STATE FROM performance_schema.replication_group_members WHERE MEMBER_ID=@@server_uuid
  register: gr_local
  until: gr_local.query_result is defined and gr_local.query_result[0] | selectattr('MEMBER_STATE', 'equalto', 'RECOVERING') | list | length == 0
  retries: 60
  delay: 5
  changed_when: false
  no_log: true
- name: Remember which members are online
  ansible.builtin.set_fact:
    gr_online: "{{ gr_local.query_result[0] | selectattr('MEMBER_STATE', 'equalto', 'ONLINE') | list | length > 0 }}"
- name: Inspect previous group bootstrap marker
  ansible.builtin.stat:
    path: /var/lib/mysql/.ansible-gr-created
  register: gr_marker
- name: List online members
  ansible.builtin.set_fact:
    gr_online_hosts: "{{ groups['gr_members'] | map('extract', hostvars) | selectattr('gr_online', 'equalto', true) | map(attribute='inventory_hostname') | list }}"
  run_once: true
- name: Do not bootstrap an established group again
  ansible.builtin.assert:
    that:
    - groups['gr_members'] | difference(ansible_play_hosts_all) | length == 0
    - gr_online_hosts | length > 0 or (groups['gr_members'] | map('extract', hostvars) | map(attribute='gr_marker.stat.exists') | select('equalto', true) | list | length == 0)
    - percona_group_password | length > 0
    fail_msg: Run against all group members. If an established group is fully offline, recover it deliberately; this setup never force-bootstraps it.
  run_once: true
- name: Prepare offline members
  ansible.builtin.include_tasks: member.yml
  when: not gr_online
- name: Bootstrap the first group
  ansible.builtin.include_tasks: bootstrap.yml
  when: gr_online_hosts | length == 0
  run_once: true
- name: Re-check local group state before joining
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ vault_percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT MEMBER_STATE FROM performance_schema.replication_group_members WHERE MEMBER_ID=@@server_uuid
  register: gr_join_check
  changed_when: false
  no_log: true
  when: not gr_online and not (inventory_hostname == percona_group_seed and gr_online_hosts | length == 0)
- name: Remember whether this member still needs to join
  ansible.builtin.set_fact:
    gr_join_needed: "{{ gr_join_check.query_result[0] | selectattr('MEMBER_STATE', 'in', ['ONLINE', 'RECOVERING']) | list | length == 0 }}"
  when: not gr_online and not (inventory_hostname == percona_group_seed and gr_online_hosts | length == 0)
- name: Join offline members to the group
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ vault_percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: START GROUP_REPLICATION
  when: gr_join_needed | default(false) | bool
  # mysqld auto-starts Group Replication on boot (group-replication-start-
  # on-boot is ON), so a member can already be ONLINE or RECOVERING by the
  # time this task runs. That is what happened to db3 on two fresh deploys:
  # its auto-start joined the group once db1 bootstrapped it, then this
  # START failed with MySQL error 3093 (group already running), and the
  # retry loop could not help because 3093 is not transient. The re-check
  # above skips START when the member is already in the group. Error 3093
  # The re-check looks at MEMBER_STATE, not just row presence: an OFFLINE
  # member still shows one row (itself, OFFLINE) after it leaves the group,
  # and it DOES need START. Only ONLINE or RECOVERING means skip.
  # is the same condition racing in between the check and the START, so
  # treat it as success; the next task waits for ONLINE either way. Other
  # failures (transient GCS errors) still retry 5 times, then fail.
  register: gr_join
  until: gr_join is succeeded
  retries: 5
  delay: 10
  failed_when: gr_join is failed and '3093' not in (gr_join.msg | default(''))
  no_log: true
- name: Wait for this member to become online
  community.mysql.mysql_query:
    login_user: '{{ percona_root_username }}'
    login_password: '{{ percona_root_password }}'
    login_unix_socket: '{{ percona_socket }}'
    config_file: ''
    query: SELECT MEMBER_STATE FROM performance_schema.replication_group_members WHERE MEMBER_ID=@@server_uuid
  register: gr_joined
  until: gr_joined.query_result is defined and gr_joined.query_result[0] | selectattr('MEMBER_STATE', 'equalto', 'ONLINE') | list | length == 1
  retries: 60
  delay: 5
  changed_when: false
  no_log: true

- name: Record group membership
  ansible.builtin.file:
    path: /var/lib/mysql/.ansible-gr-created
    state: touch
    owner: mysql
    group: mysql
    mode: '0600'
    modification_time: preserve
    access_time: preserve

