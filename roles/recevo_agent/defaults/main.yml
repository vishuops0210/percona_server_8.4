---
# Recevo agent role defaults.
recevo_agent_user: vishal
recevo_agent_group: vishal
recevo_agent_home: /home/vishal/agent

# Backup MySQL user. The user itself is created by hand (see
# agent/DEPLOY.md); the role only writes client.cnf with these credentials.
recevo_backup_user: backup
recevo_backup_password: ""
recevo_client_host: 127.0.0.1
recevo_client_port: 3306
recevo_client_file: /etc/percona-backup/client.cnf

recevo_backup_path: /var/backup/mysql
recevo_binlog_path: /var/backup/binlog
recevo_datadir: /var/lib/mysql
