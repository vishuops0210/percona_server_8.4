---
- name: Require the backup user password
  ansible.builtin.assert:
    that:
      - recevo_backup_password | length > 0
    fail_msg: Set recevo_backup_password (vault or --extra-vars). The backup user itself is created by hand; the role only writes client.cnf.

- name: Create the backup directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ recevo_agent_user }}"
    group: "{{ recevo_agent_group }}"
    mode: "0700"
  loop:
    - "{{ recevo_backup_path }}"
    - "{{ recevo_binlog_path }}"

- name: Create the client config directory
  ansible.builtin.file:
    path: /etc/percona-backup
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the MySQL client config for the backup user
  ansible.builtin.template:
    src: client.cnf.j2
    dest: "{{ recevo_client_file }}"
    owner: "{{ recevo_agent_user }}"
    group: "{{ recevo_agent_group }}"
    mode: "0600"
