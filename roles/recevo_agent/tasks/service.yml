---
- name: Install the agent systemd unit
  ansible.builtin.template:
    src: recevo-agent.service.j2
    dest: /etc/systemd/system/recevo-agent.service
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd and enable and start the agent service
  ansible.builtin.systemd:
    name: recevo-agent
    daemon_reload: true
    enabled: true
    state: started
