---
# Install Percona Server 8.4 on the target if it is not already installed.
- name: Check if MySQL is installed
  ansible.builtin.command: which mysql
  register: mysql_check
  failed_when: false
  changed_when: false

- name: Install Percona Server 8.4
  when: mysql_check.rc != 0
  block:
    - name: Download Percona release package
      ansible.builtin.get_url:
        url: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
        dest: /tmp/percona-release_latest.generic_all.deb
        mode: "0644"

    - name: Install Percona release package
      ansible.builtin.apt:
        deb: /tmp/percona-release_latest.generic_all.deb

    - name: Enable Percona Server 8.4 repo
      ansible.builtin.command: percona-release setup ps84
      args:
        creates: /etc/apt/sources.list.d/percona-ps-84.list

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: false

    - name: Install Percona Server
      ansible.builtin.apt:
        name: percona-server-server
        state: present
        update_cache: false

    - name: Stop MySQL after install
      ansible.builtin.systemd:
        name: mysql
        state: stopped
      ignore_errors: true
