---
- name: Check that a Percona XtraBackup 8.4 candidate is available
  ansible.builtin.command:
    argv:
      - apt-cache
      - policy
      - percona-xtrabackup-84
  environment:
    LC_ALL: C
  register: recevo_xtrabackup_candidate
  changed_when: false

- name: Refuse an implicit major upgrade
  ansible.builtin.assert:
    that:
      - recevo_xtrabackup_candidate.stdout is search('Candidate: 8\.4\.')
    fail_msg: No 8.4 XtraBackup candidate available. Enable the Percona ps-84-lts repository first.

- name: Install the MySQL client and XtraBackup
  ansible.builtin.apt:
    name:
      - percona-server-client
      - percona-xtrabackup-84
    state: present
    update_cache: false
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Confirm the tools are present
  ansible.builtin.command:
    argv:
      - which
      - mysql
      - mysqlbinlog
      - xtrabackup
  register: recevo_tools
  changed_when: false
